# ~/.tmux.conf — symlinked from dotfiles by setup.sh (section 7).
#
# Opt-in persistence layer: `cct <project>` runs `cc` inside a named tmux
# session so the Claude process outlives a closed Windows Terminal tab or a
# dropped SSH hop. Remote Control needs that process alive — the session goes
# offline within seconds of it exiting — so tmux and Remote Control are
# complementary, not alternatives. Plain `cc` and `wsl6` never touch tmux.

# ── Claude Code requirements ─────────────────────────────────────────
# Shift+Enter (multi-line prompt) inside tmux needs extended keys and
# passthrough even when the outer terminal supports them:
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on
set -g focus-events on

# ── Terminal ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'
set -sg escape-time 10
set -g history-limit 10000

# Mouse: scroll, pane focus, resize. tmux owns drag-select while this is on —
# hold Shift to let Windows Terminal copy natively instead.
set -g mouse on

# ── Windows / panes ──────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Status bar ───────────────────────────────────────────────────────
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=green]#S '
set -g status-right '#[fg=yellow]%H:%M'
set -g status-left-length 20

bind r source-file ~/.tmux.conf \; display "Config reloaded"
