name: harvest-codex-comments

# Captures the GitHub Codex bot's inline review comments on a merged PR (#555).
# The in-session PreMergeCodexHarvest hook fires when `gh pr merge --auto` arms
# auto-merge, which is before the bot has reviewed, so it harvests nothing.
# This runs claude/scripts/harvest-codex-comments.sh for the merged PR, which
# files (or appends to) one consolidated issue per PR. It runs twice over:
#   - at close (pull_request: closed), for comments the bot left before the
#     merge;
#   - on each review the bot submits to the PR after it merged
#     (pull_request_review: submitted), for comments that land later (#617).
#     The bot often reviews minutes after a fast auto-merge, and the close-time
#     run, about three seconds after the merge, then finds nothing.
# The script's per-PR and per-comment markers make the runs idempotent, and
# each one harvests every comment on the PR, not only the triggering review's.
# Open PRs are codex-findings.yml's job (it labels unresolved bot threads);
# this workflow acts on merged PRs only, so the two never overlap.
#
# Security of the review trigger. The event is caused by a bot, but nothing
# from the review reaches the job except as data: the job's `if` compares the
# reviewer's login, PR_NUMBER is the payload's integer PR number passed
# through env, and comment bodies are read by the script through the API and
# written to the issue as quoted text, never evaluated. The checkout is the
# merge commit on the default branch, never the PR head. The token scopes are
# the ones below, the same for both triggers. Fork PRs are skipped on both:
# their GITHUB_TOKEN is read-only, so a harvest could not write anyway.
#
# A review event's pull_request object is GitHub's "simple pull request"
# shape, which has merged_at but no `merged` field, so merged is tested as
# `merged_at != null` on that path.
#
# Its own workflow rather than a job in delete-branch-on-close.yml: that one
# holds contents: write for ref deletion, and this needs issues: write instead —
# one file each keeps both token scopes minimal.

on:
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read # check out the merged commit for the script and gate-lib.sh
  issues: write # file or append to the consolidated issue, apply its labels
  pull-requests: read # list the PR's review comments and read its title

jobs:
  harvest:
    name: harvest Codex-bot comments of the merged PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Merged same-repo PRs only: a fork PR's GITHUB_TOKEN is read-only whatever
    # the permissions block says, so its harvest could not write. A fork PR's
    # bot comments are harvested by running the script by hand. On the review
    # trigger, only the Codex bot's reviews count: REST reports the app's login
    # with the [bot] suffix, which no user account can hold.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true) ||
       (github.event_name == 'pull_request_review' &&
        github.event.pull_request.state == 'closed' &&
        github.event.pull_request.merged_at != null &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]'))
    # One harvest at a time per PR: two runs appending to the same issue body
    # could drop each other's items until the next run restores them. Keyed by
    # PR, not repository: different PRs write different issues, and a
    # repository-wide group would let a newer pending run replace an older one
    # and lose its harvest. Within a PR group a newer pending run does replace
    # an older pending one, which is safe because every run harvests the whole
    # PR. Only an eligible run joins the PR's group (the expression is the
    # job's `if` verbatim): every other review on the PR gets a group of its
    # own from its run id, so a human's review queued behind a running harvest
    # can never replace the bot's pending run and then skip its own job.
    concurrency:
      group: "harvest-codex-comments-${{ (github.event.pull_request.head.repo.full_name == github.repository && ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'closed' && github.event.pull_request.merged_at != null && github.event.review.user.login == 'chatgpt-codex-connector[bot]'))) && format('pr-{0}', github.event.pull_request.number) || format('skip-{0}', github.run_id) }}"
      cancel-in-progress: false
    steps:
      # The merge commit is on the default branch, so the script that runs is
      # the reviewed one, never the PR head's copy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      # gh and jq ship on the ubuntu runner image. The script exits 0 on every
      # path so it never blocks an in-session caller; here a write it could not
      # make ("could not ..." on stderr) fails the run instead, so a lost
      # harvest is visible on the Actions tab.
      - name: Harvest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/harvest.err"
          bash claude/scripts/harvest-codex-comments.sh --repo "$REPO" --pr "$PR_NUMBER" 2>"$err"
          cat "$err" >&2
          if grep -q 'could not' "$err"; then
            echo "::error::harvest-codex-comments reported a failed read or write (see above)."
            exit 1
          fi
