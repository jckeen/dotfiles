name: codex-review

# Holds a PR's merge until the GitHub Codex bot (chatgpt-codex-connector) has
# finished reviewing it (dotfiles#613 follow-up). Auto-merge fires as soon as
# required checks pass, about five minutes after a PR opens; the bot's review
# lands five to ten minutes after opening, so without this its findings arrived
# after the merge. This posts a commit status `codex-review` on the PR head:
# pending while the bot works, success once every row of its summary table
# reads Completed. Its findings are inline review threads, which the branch
# rule's "require conversation resolution" setting blocks until resolved.
#
# Canonical copy: jckeen/dotfiles. claude/scripts/fleet-codex-review.sh copies
# this file verbatim into each fleet repo and makes `codex-review` a required
# status there; edit it here, then re-run that script.
#
# Fails OPEN only where the bot is absent: if no summary comment appears within
# the poll window (the bot posts it 15-45 s after a PR opens), the status goes
# to success saying so; that is what a repo without the bot looks like, and the
# local review gate still ran before push. Once the bot is active on a PR it
# fails CLOSED: a review that ends without completing, or a head it has not
# reviewed, holds until a fresh `@codex review` completes, since an author can
# cause both (an oversized diff, a push after the review). The `codex-skip` label passes it by hand, but only when
# a repo admin or maintainer applied it.
#
# Only a review of the PR's HEAD commit counts. The bot reviews when a PR
# opens, not on later pushes, so when the head has moved past its last review
# this comments `@codex review` once per head commit and holds; a completed
# review of an earlier commit never passes a newer one.
#
# Skipped (success at once): docs-only diffs that touch no instruction surface,
# and Dependabot PRs (2026-09-02 routine-dependency ruling). Skips key on facts a
# PR author cannot choose: the changed paths and the Dependabot account, never a
# branch name or title.
#
# pull_request_target, not pull_request: a Dependabot-triggered pull_request
# run gets a read-only token and could not post the status. This is safe here
# only because the job never checks out or runs PR content; it reads the PR
# through the API. PR-controlled strings reach the script through env, never
# through ${{ }} interpolation inside `run:`.
#
# Threat model (design verdict, 2026-10-14). This stops the ordinary failure:
# a PR, usually agent-opened, auto-merging before the bot has reviewed its
# head commit. It is not a boundary against a repository WRITER, and no commit
# status can be: a writer can add a workflow that posts `codex-review` itself,
# edit the bot's summary comment, push a commit whose 7-character prefix
# collides with the reviewed one, or forge a Dependabot author email. A fork
# contributor without write access cannot reach a passing state. Holding
# writers to the review would need a check from an app they cannot drive, not
# this workflow.
#
# A bot status edit is an issue_comment event, which runs on the default
# branch and so cannot report through its own check run (that would attach to
# main's HEAD); hence a commit status on the PR head SHA. The job name differs
# from the status context so its own check run is never mistaken for it.

on:
  pull_request_target:
    # edited: only a base change counts (filtered below). Retargeting a PR
    # changes its diff without changing its head SHA.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  issue_comment:
    types: [created, edited]

permissions:
  statuses: write # post the codex-review commit status
  pull-requests: read # read the PR, its labels and changed files
  issues: write # read the bot's summary; request a re-review of a new head

jobs:
  evaluate:
    name: evaluate Codex review state
    # Only the events that can change the verdict. Every other comment and
    # label change is skipped here, which costs no runner minutes.
    if: >-
      (github.event_name == 'pull_request_target' &&
        (github.event.action == 'edited' && github.event.changes.base ||
         (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
           github.event.label.name == 'codex-skip' ||
         github.event.action != 'edited' && github.event.action != 'labeled' &&
           github.event.action != 'unlabeled')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, 'codex-pull-request-review-summary'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Job-level, so a skipped run for an unrelated comment never cancels a live
    # one. The newest event re-reads all state, so cancelling older runs loses
    # nothing.
    concurrency:
      group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Post the codex-review status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # >>> codex-review-status (extracted and tested by dotfiles
          # claude/scripts/tests/codex-review-status.test.sh)
          set -euo pipefail
          BOT='chatgpt-codex-connector[bot]'
          POLL_SECONDS="${POLL_SECONDS:-180}"
          POLL_INTERVAL="${POLL_INTERVAL:-15}"

          pr_json="$(gh api "repos/$REPO/pulls/$PR")"
          if [ "$(jq -r .state <<<"$pr_json")" != open ]; then
            echo "PR #$PR is not open; nothing to post."
            exit 0
          fi
          sha="$(jq -r .head.sha <<<"$pr_json")"

          post() {
            gh api -X POST "repos/$REPO/statuses/$sha" -f state="$1" \
              -f context=codex-review -f description="${2:0:140}" \
              -f target_url="$RUN_URL" >/dev/null
            echo "codex-review -> $1: $2"
          }

          # A docs-only diff passes; anything that steers an agent, a build or CI
          # does not, so the patterns fail toward requiring the review. Matched
          # case-insensitively (agents load claude.md as readily as CLAUDE.md),
          # in a subshell so nocasematch stays local. .txt and .mdx are not
          # docs: requirements.txt is a manifest, an .mdx file is a component.
          docs_only() (
            shopt -s nocasematch
            any=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              any=1
              # Any dot-directory (.github, .claude, .gemini, .agents, .codex,
              # .cursor, ...) holds CI or agent configuration, not docs.
              case "$f" in
                .*/* | */.*/* | skills/* | */skills/* | agents/* | */agents/* | \
                  prompts/* | */prompts/*) exit 1 ;;
              esac
              case "${f##*/}" in
                # Instruction names as review-receipt.py's instruction() and
                # risk() list them (AgentPack.md is the pack's source).
                *AGENTS*.md | *CLAUDE*.md | *GEMINI*.md | *FABLE*.md | *SKILL*.md | \
                  *MULTI-AGENT*.md | *AGENTPACK*) exit 1 ;;
                *.md | *.rst | LICENSE | LICENSE.txt) ;;
                *) exit 1 ;;
              esac
            done <<<"$1"
            [ "$any" = 1 ]
          )

          # The label counts only when someone with admin or maintain on the
          # repo applied it, so a PR author cannot waive their own review.
          skip_label_by_maintainer() {
            local actor role
            jq -e '[.labels[].name] | index("codex-skip")' <<<"$pr_json" >/dev/null || return 1
            actor="$(gh api --paginate --slurp "repos/$REPO/issues/$PR/events" | jq -r \
              '[.[][] | select(.event == "labeled" and .label.name == "codex-skip")] | last | .actor.login // empty')"
            [ -n "$actor" ] || return 1
            role="$(gh api "repos/$REPO/collaborators/$actor/permission" --jq .role_name 2>/dev/null)" || return 1
            case "$role" in
              admin | maintain) return 0 ;;
            esac
            echo "codex-skip was applied by $actor ($role), who cannot waive the review; ignoring it"
            return 1
          }

          if skip_label_by_maintainer; then
            post success "Skipped by the codex-skip label"
            exit 0
          fi
          # A fork PR never passes on its own: the bot's table names commits by
          # a 7-character prefix, which a fork author can collide without any
          # write access, and the bot may never review a fork at all. A
          # maintainer's codex-skip, applied after reading it, passes it.
          if [ "$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")" != "$REPO" ]; then
            post pending "Fork PR: a maintainer applies codex-skip after review"
            exit 0
          fi
          # Every commit must be Dependabot's: anyone with write access can push
          # onto a Dependabot branch, and those commits are not routine. The
          # commits API lists at most 250, so the list must be complete and end
          # at the head.
          if [ "$(jq -r .user.login <<<"$pr_json")" = 'dependabot[bot]' ] &&
            gh api --paginate --slurp "repos/$REPO/pulls/$PR/commits" |
            jq -e --argjson n "$(jq .commits <<<"$pr_json")" --arg head "$sha" \
              '[.[][]] | length == $n and length > 0 and .[-1].sha == $head and
               all(.author.login == "dependabot[bot]")' >/dev/null; then
            post success "Dependabot PR: Codex review not required"
            exit 0
          fi
          # A rename is judged on both paths. The files API lists at most 3000
          # entries, so a list shorter than changed_files is never docs-only.
          # Statuses are stored per commit and shared by every PR with this
          # head, but a docs-only verdict depends on this PR's base: when
          # another open PR has the same head, the skip does not apply and the
          # bot's review (of the commit itself, so the same for both) decides.
          files_json="$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/files")"
          files="$(jq -r '.[][] | .filename, (.previous_filename // empty)' <<<"$files_json")"
          shared="$(gh api "repos/$REPO/commits/$sha/pulls" | jq --argjson pr "$PR" --arg sha "$sha" \
            '[.[] | select(.state == "open" and .number != $pr and .head.sha == $sha)] | length')"
          if [ "$shared" = 0 ] &&
            [ "$(jq '[.[][]] | length' <<<"$files_json")" = "$(jq .changed_files <<<"$pr_json")" ] &&
            docs_only "$files"; then
            post success "Docs-only change: Codex review not required"
            exit 0
          fi
          # A draft cannot merge, so it posts nothing: a pending status here
          # would also land on any other PR sharing this head commit and stay
          # there after the draft closed. ready_for_review evaluates it.
          if [ "$(jq -r .draft <<<"$pr_json")" = true ]; then
            echo "Draft PR: no status until it is marked ready."
            exit 0
          fi

          comments() {
            gh api --paginate --slurp "repos/$REPO/issues/$PR/comments"
          }
          summary() {
            comments | jq -r --arg bot "$BOT" \
              '[.[][] | select(.user.login == $bot and (.body | contains("codex-pull-request-review-summary")))] | last | .body // empty'
          }
          # "<review type>\t<status>\t<commit>\t<finished at>" for each review row
          # of the summary table; a row ends in its backticked commit SHA, and a
          # finished row's status cell carries a <relative-time datetime=...>.
          rows() {
            # shellcheck disable=SC2016 # the backticks and $N belong to grep/awk
            grep -E '^\|[^|]*\|[^|]*\|[[:space:]]*`[0-9a-f]{7,40}`[[:space:]]*\|' <<<"$1" |
              awk -F'|' '{c = $4; gsub(/[` \t]/, "", c); at = ""
                if (match($3, /datetime="[^"]*"/)) at = substr($3, RSTART + 10, RLENGTH - 11)
                print $2 "\t" $3 "\t" c "\t" at}' |
              sed -E 's/<[^>]*>[^<]*<\/[^>]*>//g; s/[*]//g; s/^[[:space:]]+//; s/[[:space:]]*\t[[:space:]]*/\t/g' || true
          }
          # When the base last changed (empty if never). Retargeting changes the
          # diff without changing the head, so a review that finished before it
          # covered a different diff.
          retargeted_at="$(gh api --paginate --slurp "repos/$REPO/issues/$PR/events" | jq -r \
            '[.[][] | select(.event == "base_ref_changed") | .created_at] | max // empty')"
          # "<review type>\t<status>" for the rows that reviewed the head commit
          # since the last retarget. A running row has no finish time yet and
          # always counts. ISO-8601 UTC times compare as strings.
          head_statuses() {
            rows "$1" | awk -F'\t' -v sha="$sha" -v since="$retargeted_at" \
              '$3 != "" && index(sha, $3) == 1 && ($4 == "" || since == "" || $4 >= since) {print $1 "\t" $2}'
          }

          body="$(summary)"
          waited=0
          while [ -z "$body" ] && [ "$waited" -lt "$POLL_SECONDS" ]; do
            sleep "$POLL_INTERVAL"
            waited=$((waited + POLL_INTERVAL))
            body="$(summary)"
          done
          if [ -z "$body" ]; then
            post success "Codex did not pick up this PR within ${POLL_SECONDS}s; not blocking"
            exit 0
          fi
          if [ -z "$(rows "$body")" ]; then
            post pending "Codex review started"
            exit 0
          fi

          statuses="$(head_statuses "$body")"
          if [ -z "$statuses" ]; then
            # Reviewed, but not this commit (or not since a retarget). Ask once
            # per head SHA and base change; the marker
            # keeps re-runs from asking again. Only this workflow's own
            # comments count, so a pasted marker cannot suppress the request.
            marker="<!-- codex-review-rerequest:$sha${retargeted_at:+:$retargeted_at} -->"
            if ! comments | jq -e --arg m "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($m)))] | length > 0' >/dev/null; then
              gh api -X POST "repos/$REPO/issues/$PR/comments" \
                -f body="@codex review"$'\n\n'"$marker" >/dev/null
              echo "requested a Codex re-review of $sha"
            fi
            # Hold, never pass: the bot is active on this PR, so a push after its
            # review must not merge unreviewed if it ignores the request.
            post pending "New commits since the Codex review; re-review requested (or comment @codex review)"
            exit 0
          fi

          running="$(cut -f2 <<<"$statuses" | grep -viE 'completed|fail|error|cancel|skip|timed out|unavailable|limit' || true)"
          if [ -n "$running" ]; then
            post pending "Codex review in progress"
            exit 0
          fi
          # Each review type (code, security) needs one Completed run on the
          # head; an earlier failed attempt of that type is superseded by it.
          # A type with no completed run holds: a diff can be made big enough
          # to fail the bot, and that must not waive the review.
          ended="$(awk -F'\t' '{ seen[$1] = $2 } $2 ~ /[Cc]ompleted/ { done[$1] = 1 }
            END { for (k in seen) if (!(k in done)) { print seen[k]; exit } }' <<<"$statuses")"
          if [ -n "$ended" ]; then
            post pending "Codex review ended without completing ($ended); comment @codex review to retry"
            exit 0
          fi
          post success "Codex review completed"
          # <<< codex-review-status
